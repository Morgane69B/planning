<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style id="app-style">
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F6F8FB; --line:#DCE1EA;
  --ink:#172033; --muted:#667085; --faint:#98A2B3;
  --accent:#2D5BE3; --accent-ink:#FFFFFF; --accent-soft:#E3EAFD;
  --today:#2D5BE3; --danger:#C2362B; --scrim:rgba(15,20,32,.42);
  --shadow:0 10px 30px rgba(20,30,60,.16);
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F131B; --surface:#171C27; --surface-2:#1D2330; --line:#2A3242;
    --ink:#E9EDF5; --muted:#9AA4B8; --faint:#6B7588;
    --accent:#7C9CFF; --accent-ink:#0F131B; --accent-soft:#232E4D;
    --today:#7C9CFF; --danger:#FF7A6E; --scrim:rgba(0,0,0,.6);
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F131B; --surface:#171C27; --surface-2:#1D2330; --line:#2A3242;
  --ink:#E9EDF5; --muted:#9AA4B8; --faint:#6B7588;
  --accent:#7C9CFF; --accent-ink:#0F131B; --accent-soft:#232E4D;
  --today:#7C9CFF; --danger:#FF7A6E; --scrim:rgba(0,0,0,.6);
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 16px 10px;display:flex;flex-direction:column;gap:12px}
.top-row{display:flex;align-items:center;gap:8px}
.period{flex:1;min-width:0}
.period h1{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1;letter-spacing:-.01em;margin:0;text-wrap:balance}
.period .sub{font-size:13px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.controls{display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;flex:1}
.seg button{flex:1;height:34px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.today-btn{height:40px;padding:0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px}

/* Main scroll */
main{flex:1;overflow-y:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch}

/* Week view */
.week{display:flex;flex-direction:column;gap:8px}
.day{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;text-align:left;width:100%}
.day.is-today{border-color:var(--today);box-shadow:inset 3px 0 0 var(--today)}
.day-date{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.day-date .dow{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.day-date .num{font-family:var(--f-display);font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.is-today .day-date .dow,.is-today .day-date .num{color:var(--today)}
.day-body{display:flex;flex-direction:column;gap:6px;min-width:0;padding-top:2px}
.free{color:var(--faint);font-size:14px;padding-top:8px}
.shift{display:flex;align-items:center;gap:10px;border-radius:10px;padding:8px 10px;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line)}
.shift .sw{width:10px;align-self:stretch;border-radius:4px;flex:none}
.shift .t{font-weight:600;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shift .t small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shift .h{font-family:var(--f-mono);font-size:13px;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 4px 4px;color:var(--muted);font-size:14px}
.total b{font-family:var(--f-mono);color:var(--ink);font-weight:500;font-size:15px}

/* Month view */
.month{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mhead,.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mhead span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:center;padding:8px 0}
.cell{min-height:74px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px 3px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0}
.cell:nth-child(7n+1){border-left:0}
.cell.out{background:var(--surface-2)}
.cell.out .cn{color:var(--faint)}
.cn{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cell.is-today .cn{background:var(--today);color:var(--accent-ink)}
.pill{font-size:10.5px;font-weight:600;line-height:1;border-radius:5px;padding:4px 3px;white-space:nowrap;overflow:hidden;text-overflow:clip;font-family:var(--f-mono);letter-spacing:-.02em}
.more{font-size:10.5px;color:var(--muted);padding-left:2px}

/* Bottom bar: templates */
.bar{background:var(--surface);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.bar-label{font-size:12px;color:var(--muted);padding:0 16px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar-label button{color:var(--accent);font-weight:600;font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);font-weight:600;font-size:14px}
.chip .dot{width:14px;height:14px;border-radius:4px;flex:none}
.chip .hr{font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .hr{color:inherit;opacity:.75}
.paint-note{margin:0 16px 10px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:14px;display:flex;align-items:center;gap:10px}
.paint-note span{flex:1}
.paint-note button{font-weight:700;color:var(--accent)}
.painting .day,.painting .cell{cursor:copy}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;opacity:0;transition:opacity .18s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);max-height:88%;overflow-y:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);max-width:720px;margin:0 auto}
.sheet.show{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-family:var(--f-display);font-size:21px;font-weight:700;margin:0 0 14px;text-wrap:balance}
.sheet h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:18px 0 8px;font-weight:600}
.stack{display:flex;flex-direction:column;gap:8px}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.qbtn{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);text-align:left;min-width:0}
.qbtn .dot{width:16px;height:16px;border-radius:5px;flex:none}
.qbtn div{min-width:0}
.qbtn b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qbtn small{font-family:var(--f-mono);color:var(--muted);font-size:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input{height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);padding:0 12px;font-size:16px;width:100%}
.field input[type="time"]{font-family:var(--f-mono)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:10px;border:2px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.actions{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;height:48px;border-radius:12px;font-weight:700;font-size:15px;background:var(--surface-2);border:1.5px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);flex:0 0 auto;padding:0 16px}
.tpl-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);width:100%;text-align:left}
.tpl-row .dot{width:16px;height:16px;border-radius:5px;flex:none}
.tpl-row b{flex:1}
.tpl-row span{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.days-pick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days-pick button{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.days-pick button b{font-size:15px;font-variant-numeric:tabular-nums}
.days-pick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.status{font-size:12px;color:var(--faint);text-align:center;padding:10px 0 0}

@media (min-width:560px){ .cell{min-height:92px;padding:6px} .pill{font-size:11.5px;padding:4px 5px} }
@media (prefers-reduced-motion: reduce){ .sheet,.scrim{transition:none} }
</style>

<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<template id="shell">
<div class="app" id="app">
  <header class="top">
    <div class="top-row">
      <button class="icon-btn" id="prev" aria-label="Période précédente"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="period"><h1 id="title">Planning</h1><div class="sub" id="subtitle"></div></div>
      <button class="icon-btn" id="next" aria-label="Période suivante"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Affichage">
        <button id="vWeek" aria-pressed="true">Semaine</button>
        <button id="vMonth" aria-pressed="false">Mois</button>
      </div>
      <button class="today-btn" id="todayBtn">Aujourd'hui</button>
    </div>
  </header>
  <main id="main"></main>
  <footer class="bar">
    <div id="paintNote" hidden></div>
    <div class="bar-label"><span>Créneaux types : touche-en un, puis les jours</span><button id="manageTpl">Modifier</button></div>
    <div class="chips" id="chips"></div>
  </footer>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" hidden></div>
</template>
<script>
(function(){
"use strict";
var SHELL=document.getElementById("shell");
SHELL.parentNode.insertBefore(SHELL.content.cloneNode(true), SHELL);
var DOW = ["lun.","mar.","mer.","jeu.","ven.","sam.","dim."];
var DOW_LONG = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
var MONTHS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
var MON_SHORT = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
var COLORS = ["#E8A33D","#E0663A","#D6457A","#7A5AF8","#2D5BE3","#1F8F7A","#4E9A2F","#22406E","#8A94A6"];
var DEFAULT_TEMPLATES = [
  {id:"matin", name:"Matin", start:"06:00", end:"14:00", color:"#E8A33D", order:1},
  {id:"aprem", name:"Après-midi", start:"14:00", end:"22:00", color:"#7A5AF8", order:2},
  {id:"journee", name:"Journée", start:"09:00", end:"17:00", color:"#1F8F7A", order:3},
  {id:"nuit", name:"Nuit", start:"22:00", end:"06:00", color:"#22406E", order:4}
];

var S = {
  view: "week",
  cursor: startOfDay(new Date()),
  events: {},      // id -> {date,start,end,title,color,tpl,note}
  templates: [],
  paint: null,     // template id while painting
  readOnly: true,   // until we know this viewer may edit
  save: "",         // "" | "pending" | "saving" | "error" | "unavailable"
  updated: null
};
try { var v = localStorage.getItem("cal.view"); if (v === "month" || v === "week") S.view = v; } catch(e){}

/* ---------- dates ---------- */
function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d,n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }
function key(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fromKey(k){ var p=k.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function dowIdx(d){ return (d.getDay()+6)%7; }
function weekStart(d){ return addDays(d, -dowIdx(d)); }
function sameDay(a,b){ return key(a)===key(b); }
function isoWeek(d){ var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); var n=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-n); var y=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y)/864e5+1)/7); }
function mins(t){ var p=(t||"0:0").split(":"); return (+p[0])*60+(+p[1]); }
function dur(ev){ var a=mins(ev.start), b=mins(ev.end); if (b<=a) b+=1440; return b-a; }
function fmtDur(m){ var h=Math.floor(m/60), r=m%60; return h+"h"+(r?String(r).padStart(2,"0"):""); }
function fmtT(t){ return (t||"").replace(":", "h"); }
function shortT(t){ var p=(t||"").split(":"); return (+p[0])+"h"+(p[1]&&p[1]!=="00"?p[1]:""); }

/* ---------- colour helpers ---------- */
function inkOn(hex){ var h=hex.replace("#",""); var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16); return (0.299*r+0.587*g+0.114*b)>160 ? "#172033" : "#FFFFFF"; }

/* ---------- DOM helper ---------- */
function h(tag, attrs){
  var el=document.createElement(tag);
  if (attrs) for (var k in attrs){
    var v=attrs[k]; if (v==null || v===false) continue;
    if (k==="text") el.textContent=v;
    else if (k==="style") el.setAttribute("style", v);
    else if (k.slice(0,2)==="on") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v===true?"":v);
  }
  for (var i=2;i<arguments.length;i++){ var c=arguments[i]; if (c==null||c===false) continue; if (Array.isArray(c)) c.forEach(function(x){ if(x) el.appendChild(typeof x==="string"?document.createTextNode(x):x); }); else el.appendChild(typeof c==="string"?document.createTextNode(c):c); }
  return el;
}
var $ = function(id){ return document.getElementById(id); };

/* ---------- storage: data.json in the GitHub repo ---------- */
var REPO="Morgane69B/planning";
var API="https://api.github.com/repos/"+REPO+"/contents/data.json";
var token=null; try{ token=localStorage.getItem("cal.token"); }catch(e){}
var sha=null, loaded=false;
var store = {
  saveEvent: function(id, data){ S.events[id]=data; changed(); return Promise.resolve(); },
  deleteEvent: function(id){ delete S.events[id]; changed(); return Promise.resolve(); },
  saveTpl: function(t){
    var full={id:t.id,name:t.name,start:t.start,end:t.end,color:t.color,order:t.order||0};
    var i=S.templates.findIndex(function(x){return x.id===t.id;});
    if (i<0) S.templates.push(full); else S.templates[i]=full; changed(); return Promise.resolve();
  },
  deleteTpl: function(id){ S.templates=S.templates.filter(function(x){return x.id!==id;}); changed(); return Promise.resolve(); }
};
function newId(){ return (Date.now().toString(36)+Math.random().toString(36).slice(2,8)); }
function sortTpl(){ S.templates.sort(function(a,b){ return (a.order||0)-(b.order||0) || a.name.localeCompare(b.name); }); }
function b64dec(b){ var bin=atob(b.replace(/\s/g,"")); var u=new Uint8Array(bin.length); for (var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new TextDecoder().decode(u); }
function b64enc(str){ var u=new TextEncoder().encode(str), bin=""; for (var i=0;i<u.length;i+=0x8000) bin+=String.fromCharCode.apply(null, u.subarray(i,i+0x8000)); return btoa(bin); }
function ghHeaders(){ var h={"Accept":"application/vnd.github+json"}; if (token) h.Authorization="Bearer "+token; return h; }

function applyData(d){
  S.events=(d&&d.events)||{}; S.templates=(d&&d.templates)||[]; S.updated=(d&&d.updated)||null; loaded=true;
}
function fetchRemote(){
  return fetch(API+"?t="+Date.now(), {headers:ghHeaders(), cache:"no-store"}).then(function(r){
    if (r.status===404){ sha=null; return {}; }
    if (!r.ok) throw new Error("http "+r.status);
    return r.json().then(function(j){ sha=j.sha; return JSON.parse(b64dec(j.content)); });
  }).catch(function(){
    return fetch("data.json?t="+Date.now(), {cache:"no-store"}).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
  });
}
function refresh(){
  if (S.save==="pending"||S.save==="saving"||!$("sheet").hidden) return Promise.resolve();
  return fetchRemote().then(function(d){ if (d){ applyData(d); render(); } else if (!loaded){ S.save="offline"; render(); } });
}

var saveTimer=null;
function changed(){
  render();
  S.save="pending"; renderSave();
  clearTimeout(saveTimer); saveTimer=setTimeout(publishNow, 2000);
}
function publishNow(retried){
  clearTimeout(saveTimer); saveTimer=null;
  if (!token) return;
  if (S.save!=="pending" && retried!==true) return;
  S.save="saving"; renderSave();
  var now=new Date().toISOString();
  var data={updated:now, templates:S.templates.map(function(t){ return {id:t.id,name:t.name,start:t.start,end:t.end,color:t.color,order:t.order||0}; }), events:S.events};
  var body={message:"Mise à jour du planning", content:b64enc(JSON.stringify(data,null,1))}; if (sha) body.sha=sha;
  fetch(API, {method:"PUT", headers:Object.assign(ghHeaders(),{"Content-Type":"application/json"}), body:JSON.stringify(body)}).then(function(r){
    if ((r.status===409||r.status===422) && retried!==true){
      return fetch(API+"?t="+Date.now(), {headers:ghHeaders(), cache:"no-store"}).then(function(x){ return x.ok?x.json():null; }).then(function(j){ sha=j&&j.sha; publishNow(true); });
    }
    if (r.status===401||r.status===403){ S.save="error"; renderSave(); toast("La clé GitHub ne marche plus. Ouvre le lien avec #modifier à la fin pour en mettre une nouvelle."); return; }
    if (!r.ok) throw new Error("http "+r.status);
    return r.json().then(function(j){ sha=j.content.sha; S.updated=now; if (S.save==="saving") S.save=""; renderSave(); });
  }).catch(function(){
    S.save="error"; renderSave(); toast("Pas enregistré, nouvel essai dans quelques secondes.");
    setTimeout(function(){ if (S.save==="error"){ S.save="pending"; publishNow(); } }, 6000);
  });
}
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState==="hidden" && S.save==="pending") publishNow();
  if (document.visibilityState==="visible") refresh();
});

function openKey(){
  openSheet(function(sh){
    sh.appendChild(h("h2",{text:"Modifier le planning"}));
    sh.appendChild(h("p",{class:"hint",text:"Colle ta clé GitHub (accès en écriture au dépôt planning). Elle reste uniquement sur ce téléphone."}));
    var f=h("form",{class:"stack",style:"margin-top:12px",onsubmit:function(e){ e.preventDefault(); check(); }});
    var inp=h("input",{id:"ghKey",type:"password",autocomplete:"off",placeholder:"github_pat_…",required:true});
    var msg=h("p",{class:"hint"});
    f.appendChild(h("div",{class:"field"},h("label",{for:"ghKey",text:"Clé GitHub"}),inp));
    f.appendChild(msg);
    f.appendChild(h("div",{class:"actions"},h("button",{type:"submit",class:"btn primary",text:"Valider"})));
    sh.appendChild(f);
    function check(){
      var k=inp.value.trim(); if (!k) return; msg.textContent="Vérification…";
      fetch("https://api.github.com/repos/"+REPO, {headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+k}}).then(function(r){ return r.ok?r.json():null; }).then(function(j){
        if (!j || !j.permissions || !j.permissions.push){ msg.textContent="Cette clé ne permet pas de modifier le dépôt planning."; return; }
        token=k; try{ localStorage.setItem("cal.token",k); }catch(e){}
        S.readOnly=false; closeSheet(); toast("Tu peux modifier le planning sur ce téléphone.");
        fetchRemote().then(function(d){ if (d) applyData(d); render(); });
      }).catch(function(){ msg.textContent="Impossible de joindre GitHub, réessaie."; });
    }
  });
}
function forgetKey(){ token=null; try{ localStorage.removeItem("cal.token"); }catch(e){} S.readOnly=true; S.paint=null; closeSheet(); render(); toast("Clé retirée de ce téléphone."); }

/* ---------- render ---------- */
function eventsOn(k){
  var out=[]; for (var id in S.events){ var e=S.events[id]; if (e.date===k) out.push(Object.assign({id:id},e)); }
  return out.sort(function(a,b){ return mins(a.start)-mins(b.start); });
}
function tplById(id){ return S.templates.find(function(t){return t.id===id;}); }

function render(){
  sortTpl();
  $("vWeek").setAttribute("aria-pressed", S.view==="week");
  $("vMonth").setAttribute("aria-pressed", S.view==="month");
  $("app").classList.toggle("painting", !!S.paint);
  var main=$("main"); main.textContent="";
  if (S.view==="week") renderWeek(main); else renderMonth(main);
  main.appendChild(h("p",{class:"status",id:"saveState"}));
  renderSave();
  renderBar();
}
function renderSave(){
  var el=$("saveState"); if (!el) return;
  var txt="";
  if (S.save==="pending") txt="Modifications en attente…";
  else if (S.save==="saving") txt="Enregistrement…";
  else if (S.save==="error") txt="Pas encore enregistré";
  else if (S.save==="offline") txt="Impossible de charger le planning. Vérifie ta connexion.";
  else if (!loaded) txt="Chargement du planning…";
  else if (S.updated){ var d=new Date(S.updated); txt="Mis à jour le "+d.getDate()+" "+MONTHS[d.getMonth()]+" à "+String(d.getHours()).padStart(2,"0")+"h"+String(d.getMinutes()).padStart(2,"0"); }
  el.textContent=txt;
}

function renderWeek(main){
  var ws=weekStart(S.cursor), we=addDays(ws,6), today=startOfDay(new Date());
  $("title").textContent = ws.getMonth()===we.getMonth()
    ? ws.getDate()+" – "+we.getDate()+" "+MONTHS[we.getMonth()]
    : ws.getDate()+" "+MON_SHORT[ws.getMonth()]+" – "+we.getDate()+" "+MON_SHORT[we.getMonth()];
  $("subtitle").textContent = "Semaine "+isoWeek(ws)+" · "+we.getFullYear();
  var list=h("div",{class:"week"}), total=0, worked=0;
  for (var i=0;i<7;i++){
    (function(d){
      var k=key(d), evs=eventsOn(k);
      var body=h("div",{class:"day-body"});
      if (!evs.length) body.appendChild(h("div",{class:"free",text:"Libre"}));
      evs.forEach(function(ev){
        total+=dur(ev);
        body.appendChild(h("button",{class:"shift",type:"button","aria-label":ev.title+" de "+fmtT(ev.start)+" à "+fmtT(ev.end),onclick:function(e){ e.stopPropagation(); if (S.paint){ onDayTap(k); return; } openEvent(ev.id); }},
          h("span",{class:"sw",style:"background:"+ev.color}),
          h("span",{class:"t"}, ev.title, ev.note ? h("small",{text:ev.note}) : null),
          h("span",{class:"h",text:shortT(ev.start)+" – "+shortT(ev.end)})
        ));
      });
      if (evs.length) worked++;
      list.appendChild(h("div",{class:"day"+(sameDay(d,today)?" is-today":""),role:"button",tabindex:"0","aria-label":DOW_LONG[i]+" "+d.getDate()+" "+MONTHS[d.getMonth()],onclick:function(){ onDayTap(k); },onkeydown:function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); onDayTap(k);} }},
        h("div",{class:"day-date"}, h("span",{class:"dow",text:DOW[i]}), h("span",{class:"num",text:String(d.getDate())})),
        body));
    })(addDays(ws,i));
  }
  main.appendChild(list);
  main.appendChild(h("div",{class:"total"}, h("span",{text:worked+(worked>1?" jours travaillés":" jour travaillé")}), h("span",null,"Total ", h("b",{text:fmtDur(total)}))));
}

function renderMonth(main){
  var c=S.cursor, first=new Date(c.getFullYear(),c.getMonth(),1), today=startOfDay(new Date());
  $("title").textContent = MONTHS[c.getMonth()].charAt(0).toUpperCase()+MONTHS[c.getMonth()].slice(1);
  var start=weekStart(first), total=0, days=0;
  var last=new Date(c.getFullYear(),c.getMonth()+1,0);
  var end=addDays(weekStart(last),6);
  var wrap=h("div",{class:"month"}), head=h("div",{class:"mhead"}), grid=h("div",{class:"mgrid"});
  DOW.forEach(function(d){ head.appendChild(h("span",{text:d.slice(0,3)})); });
  for (var d=start; d<=end; d=addDays(d,1)){
    (function(d){
      var k=key(d), evs=eventsOn(k), out=d.getMonth()!==c.getMonth();
      if (!out && evs.length){ days++; evs.forEach(function(e){ total+=dur(e); }); }
      var cell=h("button",{type:"button",class:"cell"+(out?" out":"")+(sameDay(d,today)?" is-today":""),"aria-label":d.getDate()+" "+MONTHS[d.getMonth()]+(evs.length?", "+evs.map(function(e){return e.title;}).join(", "):""),onclick:function(){ onDayTap(k); }},
        h("span",{class:"cn",text:String(d.getDate())}));
      evs.slice(0,2).forEach(function(e){ cell.appendChild(h("span",{class:"pill",style:"background:"+e.color+";color:"+inkOn(e.color),text:shortT(e.start)})); });
      if (evs.length>2) cell.appendChild(h("span",{class:"more",text:"+"+(evs.length-2)}));
      grid.appendChild(cell);
    })(d);
  }
  $("subtitle").textContent = c.getFullYear()+" · "+days+(days>1?" jours":" jour")+" · "+fmtDur(total);
  wrap.appendChild(head); wrap.appendChild(grid); main.appendChild(wrap);
}

function renderBar(){
  var chips=$("chips"); chips.textContent="";
  S.templates.forEach(function(t){
    chips.appendChild(h("button",{type:"button",class:"chip","aria-pressed":S.paint===t.id,disabled:S.readOnly,onclick:function(){ S.paint = S.paint===t.id ? null : t.id; render(); }},
      h("span",{class:"dot",style:"background:"+t.color}), t.name, h("span",{class:"hr",text:shortT(t.start)+"–"+shortT(t.end)})));
  });
  var note=$("paintNote"); note.textContent="";
  var t=S.paint && tplById(S.paint);
  if (t){
    note.hidden=false;
    note.appendChild(h("div",{class:"paint-note"}, h("span",null,"Touche les jours où tu fais ", h("b",{text:t.name}), ". Retouche pour retirer."), h("button",{type:"button",text:"Terminé",onclick:function(){ S.paint=null; render(); }})));
  } else { note.hidden=true; S.paint=null; }
  $("manageTpl").hidden = S.readOnly;
  document.querySelector(".bar").hidden = S.readOnly;
}

/* ---------- interactions ---------- */
function onDayTap(k){
  if (S.paint && !S.readOnly){
    var t=tplById(S.paint); if (!t) return;
    var existing=eventsOn(k).find(function(e){ return e.tpl===t.id; });
    if (existing) store.deleteEvent(existing.id);
    else store.saveEvent(newId(), {date:k,start:t.start,end:t.end,title:t.name,color:t.color,tpl:t.id,note:"",created:Date.now()});
    return;
  }
  openDay(k);
}

function addFromTpl(k,t){
  return store.saveEvent(newId(), {date:k,start:t.start,end:t.end,title:t.name,color:t.color,tpl:t.id,note:"",created:Date.now()});
}

/* sheet */
function openSheet(build){
  var sh=$("sheet"), sc=$("scrim");
  sh.textContent=""; sh.appendChild(h("div",{class:"grab"})); build(sh);
  sh.hidden=false; sc.hidden=false;
  requestAnimationFrame(function(){ sh.classList.add("show"); sc.classList.add("show"); });
}
function closeSheet(){
  var sh=$("sheet"), sc=$("scrim");
  sh.classList.remove("show"); sc.classList.remove("show");
  setTimeout(function(){ sh.hidden=true; sc.hidden=true; }, 200);
}
$("scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", function(e){ if (e.key==="Escape" && !$("sheet").hidden) closeSheet(); });

function dayTitle(k){ var d=fromKey(k); return DOW_LONG[dowIdx(d)].charAt(0).toUpperCase()+DOW_LONG[dowIdx(d)].slice(1)+" "+d.getDate()+" "+MONTHS[d.getMonth()]; }

function openDay(k){
  openSheet(function(sh){
    sh.appendChild(h("h2",{text:dayTitle(k)}));
    var evs=eventsOn(k);
    if (evs.length){
      var st=h("div",{class:"stack"});
      evs.forEach(function(ev){
        st.appendChild(h("button",{type:"button",class:"shift",onclick:function(){ openEvent(ev.id); }},
          h("span",{class:"sw",style:"background:"+ev.color}), h("span",{class:"t"},ev.title, ev.note?h("small",{text:ev.note}):null), h("span",{class:"h",text:fmtT(ev.start)+" – "+fmtT(ev.end)})));
      });
      sh.appendChild(st);
    } else sh.appendChild(h("p",{class:"hint",text:"Rien de prévu ce jour-là."}));
    if (S.readOnly) return;
    sh.appendChild(h("h3",{text:"Ajouter en un geste"}));
    var q=h("div",{class:"quick"});
    S.templates.forEach(function(t){
      q.appendChild(h("button",{type:"button",class:"qbtn",onclick:function(){ addFromTpl(k,t).then(function(){ toast(t.name+" ajouté"); }).catch(function(){}); closeSheet(); }},
        h("span",{class:"dot",style:"background:"+t.color}), h("div",null,h("b",{text:t.name}),h("small",{text:fmtT(t.start)+" – "+fmtT(t.end)}))));
    });
    sh.appendChild(q);
    sh.appendChild(h("div",{class:"actions"}, h("button",{type:"button",class:"btn",text:"Autre horaire…",onclick:function(){ openEvent(null,k); }})));
  });
}

function openEvent(id, dateKey){
  var ev = id ? Object.assign({}, S.events[id]) : {date:dateKey,start:"09:00",end:"17:00",title:"",color:COLORS[4],tpl:null,note:""};
  if (id && !S.events[id]) return;
  openSheet(function(sh){
    sh.appendChild(h("h2",{text: S.readOnly ? ev.title : (id ? "Modifier l'horaire" : "Nouvel horaire")}));
    var f=h("form",{class:"stack",onsubmit:function(e){ e.preventDefault(); save(); }});
    var iTitle=h("input",{id:"evTitle",type:"text",value:ev.title,placeholder:"Travail",maxlength:"40",autocomplete:"off"});
    var iDate=h("input",{id:"evDate",type:"date",value:ev.date,required:true});
    var iStart=h("input",{id:"evStart",type:"time",value:ev.start,required:true});
    var iEnd=h("input",{id:"evEnd",type:"time",value:ev.end,required:true});
    var iNote=h("input",{id:"evNote",type:"text",value:ev.note||"",placeholder:"Remplacement, lieu…",maxlength:"80",autocomplete:"off"});
    f.appendChild(h("div",{class:"field"},h("label",{for:"evTitle",text:"Intitulé"}),iTitle));
    f.appendChild(h("div",{class:"field"},h("label",{for:"evDate",text:"Jour"}),iDate));
    f.appendChild(h("div",{class:"row2"},h("div",{class:"field"},h("label",{for:"evStart",text:"Début"}),iStart),h("div",{class:"field"},h("label",{for:"evEnd",text:"Fin"}),iEnd)));
    f.appendChild(h("p",{class:"hint",text:"Si la fin est avant le début, l'horaire finit le lendemain."}));
    f.appendChild(h("div",{class:"field"},h("label",{for:"evNote",text:"Note (facultatif)"}),iNote));
    f.appendChild(h("div",{class:"field"},h("label",{text:"Couleur"}),swatchPicker(ev.color,function(c){ ev.color=c; })));
    var repeat={};
    if (!id){
      var dp=h("div",{class:"days-pick"}), base=weekStart(fromKey(ev.date));
      for (var i=0;i<7;i++){ (function(d){ var k=key(d); repeat[k]= k===ev.date;
        var b=h("button",{type:"button","aria-pressed":repeat[k],onclick:function(){ repeat[k]=!repeat[k]; b.setAttribute("aria-pressed",repeat[k]); }}, DOW[i].slice(0,2), h("b",{text:String(d.getDate())}));
        dp.appendChild(b); })(addDays(base,i)); }
      f.appendChild(h("div",{class:"field"},h("label",{text:"Même horaire d'autres jours de la semaine"}),dp));
    }
    var acts=h("div",{class:"actions"});
    if (id) acts.appendChild(h("button",{type:"button",class:"btn danger",text:"Supprimer",onclick:function(){ store.deleteEvent(id).catch(function(){}); toast("Horaire supprimé"); closeSheet(); }}));
    acts.appendChild(h("button",{type:"submit",class:"btn primary",text:"Enregistrer"}));
    f.appendChild(acts);
    sh.appendChild(f);
    if (S.readOnly){ Array.prototype.forEach.call(f.elements,function(x){ x.disabled=true; }); acts.hidden=true; }
    function save(){
      if (!iDate.value||!iStart.value||!iEnd.value) return;
      var data={date:iDate.value,start:iStart.value,end:iEnd.value,title:iTitle.value.trim()||"Travail",color:ev.color,tpl:null,note:iNote.value.trim(),created:ev.created||Date.now()};
      if (id){ store.saveEvent(id,data).catch(function(){}); }
      else {
        var keys=Object.keys(repeat).filter(function(k){ return repeat[k]; });
        if (iDate.value!==ev.date || !keys.length) keys=[iDate.value];
        keys.reduce(function(p,k){ return p.then(function(){ return store.saveEvent(newId(),Object.assign({},data,{date:k})); }); }, Promise.resolve()).catch(function(){});
      }
      toast("Enregistré"); closeSheet();
    }
  });
}

function swatchPicker(current, onPick){
  var w=h("div",{class:"swatches",role:"group","aria-label":"Couleur"});
  COLORS.forEach(function(c){
    var b=h("button",{type:"button","aria-label":"Couleur "+c,"aria-pressed":c===current,style:"background:"+c,onclick:function(){ Array.prototype.forEach.call(w.children,function(x){ x.setAttribute("aria-pressed","false"); }); b.setAttribute("aria-pressed","true"); onPick(c); }});
    w.appendChild(b);
  });
  return w;
}

function openTemplates(){
  openSheet(function(sh){
    sh.appendChild(h("h2",{text:"Créneaux types"}));
    sh.appendChild(h("p",{class:"hint",text:"Tes horaires habituels. Ils servent à remplir le planning en quelques touches."}));
    var st=h("div",{class:"stack",style:"margin-top:12px"});
    S.templates.forEach(function(t){
      st.appendChild(h("button",{type:"button",class:"tpl-row",onclick:function(){ editTemplate(t); }},
        h("span",{class:"dot",style:"background:"+t.color}), h("b",{text:t.name}), h("span",{text:fmtT(t.start)+" – "+fmtT(t.end)})));
    });
    sh.appendChild(st);
    sh.appendChild(h("div",{class:"actions"},h("button",{type:"button",class:"btn primary",text:"Nouveau créneau",onclick:function(){ editTemplate(null); }})));
    sh.appendChild(h("div",{class:"actions"},h("button",{type:"button",class:"btn danger",style:"flex:1",text:"Retirer la clé de ce téléphone",onclick:forgetKey})));
  });
}

function editTemplate(t){
  var isNew=!t;
  t = t ? Object.assign({},t) : {id:"t"+newId(),name:"",start:"08:00",end:"16:00",color:COLORS[5],order:(S.templates.length+1)};
  openSheet(function(sh){
    sh.appendChild(h("h2",{text:isNew?"Nouveau créneau":"Modifier « "+t.name+" »"}));
    var f=h("form",{class:"stack",onsubmit:function(e){ e.preventDefault(); save(); }});
    var iName=h("input",{id:"tplName",type:"text",value:t.name,placeholder:"Matin",maxlength:"24",required:true,autocomplete:"off"});
    var iStart=h("input",{id:"tplStart",type:"time",value:t.start,required:true});
    var iEnd=h("input",{id:"tplEnd",type:"time",value:t.end,required:true});
    f.appendChild(h("div",{class:"field"},h("label",{for:"tplName",text:"Nom"}),iName));
    f.appendChild(h("div",{class:"row2"},h("div",{class:"field"},h("label",{for:"tplStart",text:"Début"}),iStart),h("div",{class:"field"},h("label",{for:"tplEnd",text:"Fin"}),iEnd)));
    f.appendChild(h("div",{class:"field"},h("label",{text:"Couleur"}),swatchPicker(t.color,function(c){ t.color=c; })));
    if (!isNew) f.appendChild(h("p",{class:"hint",text:"Les horaires déjà posés ne changent pas."}));
    var acts=h("div",{class:"actions"});
    if (!isNew) acts.appendChild(h("button",{type:"button",class:"btn danger",text:"Supprimer",onclick:function(){ if (S.paint===t.id) S.paint=null; store.deleteTpl(t.id).catch(function(){}); openTemplates(); }}));
    acts.appendChild(h("button",{type:"submit",class:"btn primary",text:"Enregistrer"}));
    f.appendChild(acts); sh.appendChild(f);
    function save(){
      if (!iName.value.trim()) return;
      t.name=iName.value.trim(); t.start=iStart.value; t.end=iEnd.value;
      store.saveTpl(t).catch(function(){}); openTemplates();
    }
  });
}

var toastTimer;
function toast(msg){ var t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.hidden=true; }, 2200); }

/* navigation */
function shift(n){
  if (S.view==="week") S.cursor=addDays(S.cursor, 7*n);
  else S.cursor=new Date(S.cursor.getFullYear(), S.cursor.getMonth()+n, 1);
  render(); $("main").scrollTop=0;
}
function setView(v){
  S.view=v; try{ localStorage.setItem("cal.view",v); }catch(e){}
  if (v==="month") S.cursor=new Date(S.cursor.getFullYear(), S.cursor.getMonth(), 1);
  else { var t=startOfDay(new Date()); if (t.getMonth()===S.cursor.getMonth()&&t.getFullYear()===S.cursor.getFullYear()) S.cursor=t; }
  render();
}
$("prev").addEventListener("click", function(){ shift(-1); });
$("next").addEventListener("click", function(){ shift(1); });
$("vWeek").addEventListener("click", function(){ setView("week"); });
$("vMonth").addEventListener("click", function(){ setView("month"); });
$("todayBtn").addEventListener("click", function(){ S.cursor=startOfDay(new Date()); render(); });
$("manageTpl").addEventListener("click", openTemplates);

/* swipe between periods */
(function(){
  var sx=0, sy=0, on=false, m=$("main");
  m.addEventListener("touchstart", function(e){ if (e.touches.length!==1) return; sx=e.touches[0].clientX; sy=e.touches[0].clientY; on=true; }, {passive:true});
  m.addEventListener("touchend", function(e){ if(!on) return; on=false; var t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy; if (Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) shift(dx<0?1:-1); }, {passive:true});
})();

/* ---------- boot ---------- */
if (token) S.readOnly=false;
if (S.view==="month") S.cursor=new Date(S.cursor.getFullYear(), S.cursor.getMonth(), 1);
render();
refresh();
setInterval(function(){ if (document.visibilityState==="visible") refresh(); }, 5*60*1000);
function checkHash(){ if (/^#modifier$/i.test(location.hash)){ history.replaceState(null,"",location.pathname); if (!token) openKey(); } }
window.addEventListener("hashchange", checkHash); checkHash();
})();
</script>
